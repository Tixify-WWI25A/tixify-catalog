# Mit KI erstellt (KI-Log Nr. 6), vom Team geprüft.
openapi: 3.0.3
info:
  title: Tixify catalog-Service
  version: 1.0.0
  description: |
    Verwaltet Events und Ticketkontingente und reserviert Tickets für den Checkout.

    - Öffentliche Endpunkte (`/api/...`) werden über das gateway erreicht.
    - Interne Endpunkte (`/internal/...`) sind nur für andere Services (orders) und werden vom gateway NICHT weitergeleitet.
    - Fehler haben immer das Format `{ "error": "...", "details": { ... } }`.
    - GraphQL unter `POST /graphql` bietet denselben Funktionsumfang für Events.

servers:
  - url: https://tixify-catalog.herokuapp.com
    description: Produktion (Heroku-App tixify-catalog; genaue URL siehe Heroku-Dashboard)
  - url: http://localhost:3001
    description: lokal

tags:
  - name: Events
  - name: Adresssuche
  - name: Reservierungen (intern)

paths:
  /api/events:
    get:
      tags: [Events]
      summary: Events suchen und filtern (Use-Case 1)
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: 'Sucht in Titel, Beschreibung und Ort' }
        - { name: location, in: query, schema: { type: string }, description: 'Exakter Ort; "Alle Orte" = kein Filter' }
        - { name: category, in: query, schema: { type: string, example: 'Konzerte,Sport' }, description: 'Kommagetrennte Kategorien' }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Nur Events ab diesem Datum' }
      responses:
        '200':
          description: Events, nach Datum aufsteigend sortiert
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Events]
      summary: Event anlegen (Use-Case 2, nur Admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventInput' }
      responses:
        '201':
          description: Angelegt
          headers:
            Location: { schema: { type: string, example: /api/events/12 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Events]
      summary: Ein Event abrufen
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Events]
      summary: Event ändern (nur Admin). Nur übergebene Felder werden geändert; null löscht ein optionales Feld.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventInput' }
      responses:
        '200':
          description: Geändertes Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Events]
      summary: Event löschen (nur Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Gelöscht }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Für das Event gibt es bereits Reservierungen oder Tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/geocode:
    get:
      tags: [Adresssuche]
      summary: Adresse suchen (Nominatim, mit Cache; nur Admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 200 } }
      responses:
        '200':
          description: Bis zu 5 Treffer (leer bei weniger als 3 Zeichen)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    display_name: { type: string }
                    lat: { type: string }
                    lon: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: Nominatim nicht erreichbar oder überlastet }

  /internal/reservations:
    post:
      tags: [Reservierungen (intern)]
      summary: Tickets für eine Bestellung reservieren (alles oder nichts)
      description: |
        Verringert den Bestand sofort. Idempotent über `orderRef`: dieselbe orderRef erneut → 200 mit der bestehenden Reservierung.
        Nicht bezahlte Reservierungen werden nach 15 Minuten automatisch freigegeben.
      security: [{ internalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderRef, items]
              properties:
                orderRef: { type: string, maxLength: 100, example: 'order-8f3a' }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [eventId, quantity]
                    properties:
                      eventId: { type: integer }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '201':
          description: Reserviert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '200':
          description: Bereits reserviert (gleiche orderRef)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nicht genug Tickets; details nennt Event, gewünschte und verfügbare Menge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internal/reservations/{id}:
    get:
      tags: [Reservierungen (intern)]
      summary: Reservierung abrufen
      security: [{ internalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }]
      responses:
        '200':
          description: Reservierung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /internal/reservations/{id}/confirm:
    post:
      tags: [Reservierungen (intern)]
      summary: Nach erfolgreicher Zahlung bestätigen (idempotent)
      security: [{ internalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }]
      responses:
        '200':
          description: Bestätigt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Reservierung war bereits freigegeben (abgelaufen/storniert) }

  /internal/reservations/{id}/release:
    post:
      tags: [Reservierungen (intern)]
      summary: Freigeben, Bestand zurückgeben (bei Abbruch; idempotent)
      security: [{ internalToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReservationId' }]
      responses:
        '200':
          description: Freigegeben
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Reservierung ist bereits bezahlt }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token }

  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Ungültige Eingabe; details enthält Fehler pro Feld
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Nicht angemeldet oder Token ungültig/abgelaufen
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Angemeldet, aber keine Administratorrechte
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: 'Ungültige Eingaben.' }
        details: { type: object, additionalProperties: true, example: { price: 'darf nicht negativ sein' } }

    Category:
      type: string
      enum: [Konzerte, Festivals, Sport, Theater, Comedy]

    Event:
      type: object
      properties:
        event_id: { type: integer, example: 12 }
        title: { type: string, example: 'Lumen – Live in Stuttgart' }
        description: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        location: { type: string, example: Stuttgart }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        event_date: { type: string, format: date-time }
        price: { type: number, example: 49.9 }
        event_stock: { type: integer, example: 120 }
        logo_url: { type: string, nullable: true, format: uri }

    CreateEventInput:
      type: object
      required: [title, location, event_date, price, event_stock]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, minLength: 1, maxLength: 200 }
        event_date: { type: string, format: date-time }
        price: { type: number, minimum: 0, maximum: 100000, multipleOf: 0.01 }
        event_stock: { type: integer, minimum: 0 }
        description: { type: string, maxLength: 5000 }
        category: { $ref: '#/components/schemas/Category' }
        address: { type: string, nullable: true, maxLength: 300 }
        latitude: { type: number, nullable: true, description: 'Nur gemeinsam mit longitude' }
        longitude: { type: number, nullable: true, description: 'Nur gemeinsam mit latitude' }
        logo_url: { type: string, nullable: true, format: uri, description: 'Nur http(s)' }

    UpdateEventInput:
      type: object
      minProperties: 1
      description: Wie CreateEventInput, aber alle Felder optional; mindestens eines muss übergeben werden.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        location: { type: string, minLength: 1, maxLength: 200 }
        event_date: { type: string, format: date-time }
        price: { type: number, minimum: 0, maximum: 100000, multipleOf: 0.01 }
        event_stock: { type: integer, minimum: 0 }
        description: { type: string, maxLength: 5000 }
        category: { $ref: '#/components/schemas/Category' }
        address: { type: string, nullable: true, maxLength: 300 }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        logo_url: { type: string, nullable: true, format: uri }

    Reservation:
      type: object
      properties:
        reservationId: { type: string, format: uuid }
        orderRef: { type: string }
        status: { type: string, enum: [RESERVED, CONFIRMED, RELEASED] }
        expiresAt: { type: string, format: date-time }
        totalAmount: { type: number, example: 119.98, description: 'Summe aus den aktuellen catalog-Preisen' }
        items:
          type: array
          items:
            type: object
            properties:
              eventId: { type: integer }
              quantity: { type: integer }
              title: { type: string }
              unitPrice: { type: number }
